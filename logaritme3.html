<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Logaritmelab S1</title>

<script src="https://cdn.plot.ly/plotly-2.27.0.min.jsle>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#eef2f7;
}

header{
    background:#1f4e79;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
}

#graph{
    height:700px;
}

.level{
    display:none;
}

.level.active{
    display:block;
}

button{
    background:#1f4e79;
    color:white;
    border:none;
    padding:10px 15px;
    margin-top:10px;
    cursor:pointer;
    border-radius:6px;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
}

.ok{
    color:green;
    font-weight:bold;
}

.fail{
    color:darkred;
    font-weight:bold;
}

.badge{
    background:#d9edf7;
    display:inline-block;
    padding:5px 10px;
    border-radius:10px;
    margin-right:5px;
}

</style>
</head>
<body>

<header>
<h1>Logaritmelab S1</h1>
<p>Utforsk logaritmer og eksponentialfunksjoner</p>
</header>

<div class="container">

<div class="card">

<h3>Utforsk grafene</h3>

<label>Base a</label>

<select id="base">
<option>2</option>
<option>3</option>
<option>5</option>
<option selected>10</option>
</select>

<label>Eksponent x</label>

<input
type="range"
id="slider"
min="-3"
max="4"
step="0.01"
value="1">

<div id="graph"></div>

</div>

<div class="card">

<div>
<span class="badge">
Nivå: <span id="levelNo">1</span>
</span>

<span class="badge">
Poeng: <span id="score">0</span>
</span>
</div>

<!-- Nivå 1 -->

<div id="level1" class="level active">

<h2>Nivå 1: Oppdag</h2>

<p>Flytt på base og eksponent.</p>

<ul>
<li>Hva observerer du?</li>
<li>Hva skjer når basen øker?</li>
<li>Hvorfor bytter punktene plass?</li>
</ul>

<textarea id="obs"></textarea>

<button onclick="finishLevel1()">
Neste nivå
</button>

<div id="msg1"></div>

</div>

<!-- Nivå 2 -->

<div id="level2" class="level">

<h2>Nivå 2</h2>

<p id="q2"></p>

<input id="a2">

<button onclick="check2()">
Sjekk
</button>

<div id="fb2"></div>

</div>

<!-- Nivå 3 -->

<div id="level3" class="level">

<h2>Nivå 3</h2>

<p id="q3"></p>

<input id="a3">

<button onclick="check3()">
Sjekk
</button>

<div id="fb3"></div>

</div>

<!-- Ferdig -->

<div id="finished" class="level">

<h2>🏆 Gratulerer!</h2>

<p>Du har fullført Logaritmelab!</p>

<h3>Sluttpoeng:</h3>

<p id="finalScore"></p>

</div>

</div>

</div>

<script>

let score=0;

const slider=document.getElementById("slider");
const base=document.getElementById("base");

function loga(x,a){
    return Math.log(x)/Math.log(a);
}

function draw(){

    const a=parseFloat(base.value);
    const x=parseFloat(slider.value);

    const y=Math.pow(a,x);

    let ex=[];
    let ey=[];

    for(let t=-3;t<=4;t+=0.05){

        ex.push(t);
        ey.push(Math.pow(a,t));

    }

    let lx=[];
    let ly=[];

    for(let t=0.01;t<=100;t+=0.1){

        lx.push(t);
        ly.push(loga(t,a));

    }

    Plotly.react("graph",[

    {
        x:ex,
        y:ey,
        mode:"lines",
        name:`y=${a}^x`
    },

    {
        x:lx,
        y:ly,
        mode:"lines",
        name:`log_${a}(x)`
    },

    {
        x:[-3,10],
        y:[-3,10],
        mode:"lines",
        name:"y=x"
    },

    {
        x:[x],
        y:[y],
        mode:"markers",
        marker:{size:12}
    },

    {
        x:[y],
        y:[x],
        mode:"markers",
        marker:{size:12,color:"red"}
    }

    ],

    {
        xaxis:{range:[-3,12]},
        yaxis:{range:[-3,12]}
    });

}

slider.addEventListener("input",draw);
base.addEventListener("change",draw);

draw();

function addScore(n){

    score+=n;

    document.getElementById("score").innerText=score;
}

function showLevel(n){

    document.querySelectorAll(".level")
    .forEach(e=>e.classList.remove("active"));

    document
    .getElementById("level"+n)
    .classList.add("active");

    document.getElementById("levelNo").innerText=n;
}

function finishLevel1(){

    if(document.getElementById("obs").value.length<10){

        document.getElementById("msg1").innerHTML=
        "<p class='fail'>Skriv en observasjon først.</p>";

        return;
    }

    addScore(10);

    showLevel(2);
}

const q2list=[

{q:"log₂(32)",a:5},
{q:"log₂(8)",a:3},
{q:"log₅(125)",a:3},
{q:"log₁₀(1000)",a:3}

];

const q2=q2list[
Math.floor(Math.random()*q2list.length)
];

document.getElementById("q2").innerText=
"Hva er "+q2.q+" ?";

function check2(){

    let s=Number(
    document.getElementById("a2").value);

    if(s===q2.a){

        addScore(20);

        document.getElementById("fb2").innerHTML=
        "<p class='ok'>Riktig!</p>";

        setTimeout(()=>{
            showLevel(3);
        },1000);

    }else{

        document.getElementById("fb2").innerHTML=
        "<p class='fail'>Prøv igjen.</p>";

    }
}

const q3list=[

{q:"log₂(1/8)",a:-3},
{q:"log₅(1/25)",a:-2},
{q:"log₁₀(0.001)",a:-3},
{q:"log₃(81)",a:4}

];

const q3=q3list[
Math.floor(Math.random()*q3list.length)
];

document.getElementById("q3").innerText=
"Hva er "+q3.q+" ?";

function check3(){

    let s=Number(
    document.getElementById("a3").value
    .replace(",",".")
    );

    if(s===q3.a){

        addScore(30);

        document.getElementById("fb3").innerHTML=
        "<p class='ok'>Fantastisk!</p>";

        setTimeout(finishGame,1000);

    }else{

        document.getElementById("fb3").innerHTML=
        "<p class='fail'>Prøv igjen.</p>";

    }
}

function finishGame(){

    document.querySelectorAll(".level")
    .forEach(e=>e.classList.remove("active"));

    document
    .getElementById("finished")
    .classList.add("active");

    document
    .getElementById("finalScore")
    .innerText=score;
}

</script>

</body>
</html>
