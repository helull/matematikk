<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Oppdag e</title>

<style>

body{
    font-family:Arial;
    max-width:1000px;
    margin:auto;
    padding:20px;
    background:#f4f7fb;
}

h1{
    color:#003366;
}

.panel{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 12px rgba(0,0,0,0.1);
}

.slider-box{
    margin:20px 0;
}

#steps{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:250px;
    margin-top:20px;
    border-bottom:3px solid black;
}

.bar{
    background:linear-gradient(
      to top,
      #4da6ff,
      #0073e6);
    width:12px;
}

.big{
    font-size:1.5rem;
    font-weight:bold;
}

.value{
    color:#0066cc;
}

.e-value{
    color:red;
}

canvas{
    margin-top:30px;
    border:1px solid #ddd;
}

</style>
</head>
<body>

<div class="panel">

<h1>Kan du oppdage tallet e?</h1>

<p>
Du setter inn <b>1 krone</b> til
<b>100 % rente i ett år</b>.
</p>

<p>
Hvor ofte skal banken legge til renter?
</p>

<div class="slider-box">

<input
type="range"
min="1"
max="1000"
value="1"
id="slider"
style="width:100%;">

</div>

<p>
Renteperioder:
<span id="n">1</span>
</p>

<p class="big">
Sluttverdi:
<span class="value" id="result">2.000000</span>
</p>

<p>
Tallet e =
<span class="e-value">2.718281828...</span>
</p>

<p>
Avstand til e:
<span id="difference"></span>
</p>

<div id="steps"></div>

<canvas id="graph" width="900" height="350"></canvas>

</div>

<script>

const slider = document.getElementById("slider");

slider.addEventListener("input", update);

function update(){

    const n = Number(slider.value);

    document.getElementById("n").textContent = n;

    const finalValue =
        Math.pow(1 + 1/n, n);

    document.getElementById("result")
      .textContent =
      finalValue.toFixed(6);

    document.getElementById("difference")
      .textContent =
      Math.abs(
      Math.E-finalValue
      ).toFixed(8);

    drawGrowth(n);
    drawGraph(n);
}

function drawGrowth(n){

    const container =
      document.getElementById("steps");

    container.innerHTML="";

    let capital = 1;

    const shown =
      Math.min(100,n);

    for(let i=0;i<shown;i++){

        capital *= (1 + 1/n);

        const bar =
          document.createElement("div");

        bar.className="bar";

        bar.style.height =
          (capital*80)+"px";

        bar.style.width =
          (800/shown)+"px";

        container.appendChild(bar);
    }
}

function drawGraph(currentN){

    const canvas =
      document.getElementById("graph");

    const ctx =
      canvas.getContext("2d");

    ctx.clearRect(
      0,0,
      canvas.width,
      canvas.height
    );

    ctx.beginPath();

    for(let n=1;n<=1000;n++){

        const yval =
          Math.pow(
          1+1/n,
          n
          );

        const x =
          50 +
          n/1000*800;

        const y =
          300 -
          (yval-2)
          *380;

        if(n===1)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);
    }

    ctx.strokeStyle="blue";
    ctx.lineWidth=3;
    ctx.stroke();

    const eY =
      300-
      (Math.E-2)
      *380;

    ctx.beginPath();
    ctx.moveTo(50,eY);
    ctx.lineTo(850,eY);

    ctx.strokeStyle="red";
    ctx.setLineDash([8,8]);
    ctx.stroke();

    ctx.setLineDash([]);

    const pointY =
      300-
      (Math.pow(
      1+1/currentN,
      currentN
      )-2)
      *380;

    const pointX =
      50+
      currentN/1000*800;

    ctx.beginPath();
    ctx.arc(
      pointX,
      pointY,
      6,
      0,
      Math.PI*2
    );

    ctx.fillStyle="orange";
    ctx.fill();

    ctx.fillStyle="red";
    ctx.fillText(
      "e",
      860,
      eY
    );
}

update();

</script>

</body>
</html>
