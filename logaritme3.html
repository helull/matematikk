<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Utforsk logaritmer i GeoGebra</title>

<script src="https://www.geogebra.oyggb.jsscript> </script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

header{
    background:#1f4e79;
    color:white;
    padding:20px;
    text-align:center;
}

main{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

#ggb-element{
    width:100%;
    height:700px;
}

ul{
    line-height:1.8;
}
</style>
</head>

<body>

<header>
<h1>Utforsk logaritmer</h1>
<p>Oppdag sammenhengen mellom eksponentialfunksjoner og logaritmer</p>
</header>

<main>

<div class="card">

<h2>Oppdrag</h2>

<p>
Bruk sliderne i GeoGebra-vinduet.
Flytt på både <strong>a</strong> og <strong>x₀</strong>.
Prøv å oppdage mønsteret selv.
</p>

<ul>
<li>Hva skjer når basen øker?</li>
<li>Hvorfor speiles punktene om linjen y = x?</li>
<li>Hva betyr logₐ(x)?</li>
<li>Hva blir log₂(8)?</li>
<li>Hva blir log₅(125)?</li>
<li>Hva blir log₁₀(0,01)?</li>
</ul>

</div>

<div class="card">
<div id="ggb-element"></div>
</div>

</main>

<script>

var params = {

    appName: "graphing",

    width: 1100,
    height: 700,

    showToolBar: false,
    showAlgebraInput: false,
    showMenuBar: false,

    enableShiftDragZoom: true,

    useBrowserForJS: true
};

var applet = new GGBApplet(params, true);

window.addEventListener("load", function () {
    applet.inject("ggb-element");
});

function ggbOnInit() {

    ggbApplet.evalCommand("a = 2");
    ggbApplet.evalCommand("x0 = 1");

    ggbApplet.evalCommand("Slider(2,10,1,a)");
    ggbApplet.evalCommand("Slider(-3,4,0.1,x0)");

    ggbApplet.evalCommand("f(x)=a^x");

    ggbApplet.evalCommand(
        "g(x)=ln(x)/ln(a)"
    );

    ggbApplet.evalCommand("y=x");

    ggbApplet.evalCommand(
        "A=(x0,f(x0))"
    );

    ggbApplet.evalCommand(
        "B=(f(x0),x0)"
    );

    ggbApplet.evalCommand(
        'T1=Text("a = "+a,(8,8))'
    );

    ggbApplet.evalCommand(
        'T2=Text("x₀ = "+Round(x0,2),(8,7))'
    );

    ggbApplet.evalCommand(
        'T3=Text("a^(x₀) = "+Round(f(x0),2),(8,6))'
    );

    ggbApplet.evalCommand(
        'T4=Text("logₐ("+Round(f(x0),2)+") = "+Round(x0,2),(8,5))'
    );

    ggbApplet.setColor("f",0,0,255);
    ggbApplet.setColor("g",220,0,0);
    ggbApplet.setColor("y",0,180,0);

    ggbApplet.setPointSize("A",7);
    ggbApplet.setPointSize("B",7);

    ggbApplet.setColor("A",0,0,255);
    ggbApplet.setColor("B",220,0,0);

    ggbApplet.setLabelVisible("A",true);
    ggbApplet.setLabelVisible("B",true);

    ggbApplet.setCoordSystem(-4,12,-4,12);
}

</script>

</body>
</html>
