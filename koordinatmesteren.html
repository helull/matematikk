<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koordinatmesteren – Matematikk 1P</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17263b;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}header{background:#16345b;color:white;padding:20px max(16px,calc((100vw - 1040px)/2))}h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem)}header p{margin:5px 0 0;color:#d5e7ff}main{max-width:1040px;margin:auto;padding:20px 14px 50px}.levels{display:flex;gap:9px;flex-wrap:wrap}.levels button,.action,.choice{border:2px solid #d5e0ee;background:white;color:#16345b;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.levels button.active{background:#174f94;color:white;border-color:#174f94}.panel{background:white;border-radius:18px;box-shadow:0 5px 24px #1234 5612;padding:clamp(15px,3vw,28px);margin-top:16px}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#52657d;font-weight:650}.progress{height:10px;background:#e4ebf5;border-radius:9px;overflow:hidden;margin:13px 0 22px}.progress>div{height:100%;background:#268a73;transition:width .25s}.content{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:start}.diagram{background:#f8fbff;border:1px solid #dce8f7;border-radius:14px;padding:8px;min-width:0}svg{display:block;width:100%;height:auto;touch-action:manipulation}.diagram small{display:block;text-align:center;color:#52657d;padding:4px}.question h2{font-size:1.3rem;margin:0 0 10px}.question p{line-height:1.55}.answers{display:grid;gap:9px;margin-top:16px}.choice{text-align:left;font-size:1rem}.choice:hover,.action:hover{border-color:#3778c6}.choice:disabled{opacity:.65;cursor:default}.field{width:100%;font:inherit;padding:12px;border:2px solid #b8c9df;border-radius:10px;max-width:240px}.action{background:#1765ae;color:white;border-color:#1765ae;margin-top:13px}.action:disabled{opacity:.5;cursor:default}.feedback{margin-top:16px;border-radius:12px;padding:13px 15px;line-height:1.5;background:#fff2da;border:1px solid #f2d299}.feedback.ok{background:#e5f6ec;border-color:#a8dfbc}.feedback strong{display:block}.hint{color:#52657d;font-size:.94rem}.footer{margin-top:20px;color:#63758b;font-size:.88rem}.tableInputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tableInputs label{display:grid;gap:5px;font-weight:700;text-align:center}.tableInputs input{min-width:0;width:100%;padding:10px;border:2px solid #b8c9df;border-radius:9px;font-size:1rem;text-align:center}.pill{display:inline-block;background:#eaf1fa;padding:5px 10px;border-radius:99px;font-size:.87rem;font-weight:700}.summary{text-align:center;padding:20px}.summary h2{font-size:1.7rem}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:#50647b;margin-top:12px}@media(max-width:700px){.content{grid-template-columns:1fr}.diagram{max-width:480px;width:100%;margin:auto}.question{order:-1}.panel{padding:16px}.levels button{flex:1;min-width:95px;padding:11px 8px;font-size:.88rem}}:focus-visible{outline:3px solid #e59a18;outline-offset:3px}
</style></head><body><header><h1>📍 Koordinatmesteren</h1><p>Utforsk koordinatsystem, punkter, grafer og verditabeller · Matematikk 1P</p></header><main><nav class="levels" aria-label="Velg nivå"><button data-level="0" class="active">1 · Bli kjent</button><button data-level="1">2 · Bruk koordinatene</button><button data-level="2">3 · Utfordringen</button></nav><section class="panel" id="app" aria-live="polite"></section><div class="footer">Tips: Du kan trykke direkte i koordinatsystemet i oppgaver som ber deg plassere et punkt. Alle oppgaver kan prøves flere ganger.</div></main><script>
const $=s=>document.querySelector(s),app=$('#app');let level=0,index=0,score=0,answered=false,wrong=0;
const tasks=[[
{type:'choice',title:'Hva er et koordinatsystem?',options:['To tallakser som står vinkelrett på hverandre','En liste med tilfeldige tall','Bare en vannrett tallinje'],correct:0,explain:'Et koordinatsystem har to akser som krysser hverandre. Vi bruker dem til å plassere punkter.',view:'axes'},
{type:'choice',title:'Hvilken akse er x-aksen (førsteaksen)?',options:['Den vannrette aksen','Den loddrette aksen','Begge aksene'],correct:0,explain:'x-aksen er vannrett og kalles også førsteaksen.',view:'xaxis'},
{type:'choice',title:'Hvilken akse er y-aksen (andreaksen)?',options:['Den vannrette aksen','Den loddrette aksen','Ingen av dem'],correct:1,explain:'y-aksen er loddrett og kalles også andreaksen.',view:'yaxis'},
{type:'choice',title:'Hva kalles de to tallinjene samlet?',options:['Punkter','Akser','Funksjonsverdier'],correct:1,explain:'Tallinjene heter akser. Vi har en x-akse og en y-akse.',view:'axes'},
{type:'choice',title:'Hva er origo?',options:['Punktet (1, 1)','Punktet (0, 0)','Punktet (0, 1)'],correct:1,explain:'Origo er der aksene møtes: (0, 0).',view:'origin'},
{type:'choice',title:'Hvordan skriver vi punktet A?',options:['A = (2, 3)','A = (3, 2)','A = 2 + 3'],correct:0,explain:'Vi skriver alltid x-verdien først og y-verdien etterpå: A = (2, 3).',view:'point',point:[2,3]},
{type:'click',title:'Trykk på origo i koordinatsystemet.',point:[0,0],explain:'Origo er (0, 0), der x-aksen og y-aksen krysser hverandre.',view:'axes'},
{type:'click',title:'Plasser punktet (3, 2).',point:[3,2],explain:'Gå 3 til høyre på x-aksen og 2 opp langs y-retningen.',view:'axes'}
],[
{type:'choice',title:'Hva er x-verdien til punktet B?',options:['−2','3','1'],correct:0,explain:'x-verdien er første tallet i punktet: B = (−2, 3).',view:'point',point:[-2,3],name:'B'},
{type:'choice',title:'Hva er y-verdien til punktet C?',options:['4','−1','0'],correct:1,explain:'y-verdien er andre tallet: C = (4, −1).',view:'point',point:[4,-1],name:'C'},
{type:'click',title:'Plasser punktet (−3, 2).',point:[-3,2],explain:'Negativ x betyr til venstre for origo. Positiv y betyr oppover.',view:'axes'},
{type:'choice',title:'Hva er en graf?',options:['En tegning som viser sammenhengen mellom x og y','Bare et punkt i origo','En tabell uten tall'],correct:0,explain:'En graf viser hvordan to størrelser henger sammen, for eksempel ved en linje i koordinatsystemet.',view:'line',fn:[1,1]},
{type:'number',title:'Grafen viser y = x + 1. Hva er funksjonsverdien når x = 2?',correct:3,explain:'Når x = 2, får vi y = 2 + 1 = 3. Funksjonsverdien er y-verdien.',view:'line',fn:[1,1],point:[2,3]},
{type:'number',title:'Grafen viser y = 2x. Hva er funksjonsverdien når x = −1?',correct:-2,explain:'Sett inn x = −1: y = 2 · (−1) = −2.',view:'line',fn:[2,0],point:[-1,-2]},
{type:'choice',title:'Hvilket punkt ligger på grafen y = x + 1?',options:['(2, 2)','(2, 3)','(3, 2)'],correct:1,explain:'Når x = 2, er y = 3. Derfor ligger (2, 3) på grafen.',view:'line',fn:[1,1]},
{type:'click',title:'Finn punktet på grafen y = x + 1 der x = −2.',point:[-2,-1],explain:'Når x = −2, er y = −2 + 1 = −1. Punktet er (−2, −1).',view:'line',fn:[1,1]}
],[
{type:'table',title:'Fyll inn funksjonsverdiene for y = 2x + 1.',xs:[-1,0,2],ys:[-1,1,5],explain:'Sett hver x-verdi inn i uttrykket 2x + 1. Du får −1, 1 og 5.',view:'line',fn:[2,1]},
{type:'number',title:'Funksjonen er f(x) = 3x − 2. Hva er f(2)?',correct:4,explain:'f(2) betyr funksjonsverdien ved x = 2: 3 · 2 − 2 = 4.',view:'line',fn:[3,-2],point:[2,4]},
{type:'choice',title:'Hvilken funksjon passer til grafen?',options:['y = 2x + 1','y = x − 2','y = −x + 1'],correct:2,explain:'Grafen går nedover når x øker og skjærer y-aksen i 1. Derfor er y = −x + 1.',view:'line',fn:[-1,1]},
{type:'click',title:'Plasser punktet (−2, −3).',point:[-2,-3],explain:'Begge koordinatene er negative: 2 til venstre og 3 ned.',view:'axes'},
{type:'table',title:'Fullfør verditabellen for f(x) = −x + 2.',xs:[-2,0,3],ys:[4,2,-1],explain:'Regn ut −x + 2 for hver x-verdi: 4, 2 og −1.',view:'line',fn:[-1,2]},
{type:'number',title:'Grafen viser y = 2x − 1. Hvilken x-verdi gir funksjonsverdien 5?',correct:3,explain:'Løs 2x − 1 = 5. Da er 2x = 6, altså x = 3.',view:'line',fn:[2,-1],point:[3,5]},
{type:'choice',title:'Hva forteller verditabellen oss?',options:['Hvilke x-verdier og tilhørende funksjonsverdier som hører sammen','Bare hvor origo ligger','At alle grafer er rette linjer'],correct:0,explain:'Hver kolonne i verditabellen gir et punkt (x, y) som kan tegnes inn i koordinatsystemet.',view:'line',fn:[1,2]},
{type:'click',title:'For f(x) = −x + 2: Plasser punktet der x = 4.',point:[4,-2],explain:'f(4) = −4 + 2 = −2. Punktet er (4, −2).',view:'line',fn:[-1,2]}
]];
function svg(t,chosen=null){let W=360,S=30,c=180,axis=(x,y)=>[c+x*S,c-y*S],out=`<svg viewBox="0 0 360 360" role="img" aria-label="Koordinatsystem med x-akse, y-akse og rutenett">`;
for(let n=-5;n<=5;n++){let v=c+n*S;out+=`<line x1="${v}" y1="15" x2="${v}" y2="345" stroke="#dbe5f0"/><line x1="15" y1="${v}" x2="345" y2="${v}" stroke="#dbe5f0"/>`}
let xcol=t.view==='xaxis'?'#e08022':'#344c68',ycol=t.view==='yaxis'?'#e08022':'#344c68';out+=`<line x1="15" y1="180" x2="345" y2="180" stroke="${xcol}" stroke-width="${t.view==='xaxis'?4:2.4}"/><path d="M345 180 l-9 -5 v10z" fill="${xcol}"/><line x1="180" y1="345" x2="180" y2="15" stroke="${ycol}" stroke-width="${t.view==='yaxis'?4:2.4}"/><path d="M180 15 l-5 9 h10z" fill="${ycol}"/>`;
for(let n=-5;n<=5;n++){if(!n)continue;let p=axis(n,0),q=axis(0,n);out+=`<text x="${p[0]}" y="197" font-size="11" text-anchor="middle" fill="#50647b">${n}</text><text x="170" y="${q[1]+4}" font-size="11" text-anchor="end" fill="#50647b">${n}</text>`}
out+=`<text x="342" y="171" font-size="17" font-weight="bold" fill="${xcol}">x</text><text x="190" y="21" font-size="17" font-weight="bold" fill="${ycol}">y</text><circle cx="180" cy="180" r="${t.view==='origin'?7:3.5}" fill="${t.view==='origin'?'#e08022':'#344c68'}"/><text x="189" y="195" font-size="11" fill="#52657d">0</text>`;
if(t.fn){let [a,b]=t.fn,p1=axis(-5,a*-5+b),p2=axis(5,a*5+b);out+=`<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#16857a" stroke-width="3.5" clip-path="url(#plotclip)"/><defs><clipPath id="plotclip"><rect x="15" y="15" width="330" height="330"/></clipPath></defs>`}
let p=t.type==='click'?(answered?t.point:null):t.point;if(p){let q=axis(...p);out+=`<circle cx="${q[0]}" cy="${q[1]}" r="7" fill="#c44150" stroke="white" stroke-width="2"/><text x="${q[0]+11}" y="${q[1]-11}" font-size="15" font-weight="bold" fill="#a82d3c">${t.name||'A'}</text>`}
if(chosen){let q=axis(...chosen);out+=`<circle cx="${q[0]}" cy="${q[1]}" r="9" fill="none" stroke="#dc8b1e" stroke-width="3"/>`}
if(t.type==='click'&&!answered){for(let x=-5;x<=5;x++)for(let y=-5;y<=5;y++){let q=axis(x,y);out+=`<circle class="hit" data-x="${x}" data-y="${y}" cx="${q[0]}" cy="${q[1]}" r="13" fill="transparent" style="cursor:pointer"/>`}}
return out+'</svg>'}
function render(){let ts=tasks[level];if(index>=ts.length){app.innerHTML=`<div class="summary"><span class="pill">Nivå ${level+1} fullført</span><h2>🎉 Godt jobbet!</h2><p>Du fikk <strong>${score} av ${ts.length}</strong> riktige på første forsøk.</p><p>${score===ts.length?'Full pott!': 'Du kan prøve nivået på nytt og forbedre resultatet.'}</p><button class="action" id="again">Prøv nivået igjen</button> ${level<2?'<button class="action" id="nextLevel">Neste nivå →</button>':''}</div>`;$('#again').onclick=()=>start(level);if($('#nextLevel'))$('#nextLevel').onclick=()=>start(level+1);return}
let t=ts[index];app.innerHTML=`<div class="meta"><span>Nivå ${level+1} · Oppgave ${index+1} av ${ts.length}</span><span>⭐ ${score} poeng</span></div><div class="progress" aria-label="Fremdrift"><div style="width:${index/ts.length*100}%"></div></div><div class="content"><div class="diagram" id="diagram">${svg(t)}<small>${t.type==='click'?'Trykk på et rutenettpunkt':'Hver rute er én enhet'}</small></div><div class="question"><h2>${t.title}</h2><p class="hint">${t.type==='click'?'Velg punktet direkte i tegningen.':t.type==='table'?'Skriv y-verdien som hører til hver x-verdi.':'Studer tegningen før du svarer.'}</p><div id="answer"></div><div id="feedback" aria-live="polite"></div><button class="action" id="next" style="display:none">${index===ts.length-1?'Se resultatet':'Neste oppgave →'}</button></div></div>`;
let a=$('#answer');if(t.type==='choice'){a.innerHTML='<div class="answers">'+t.options.map((v,i)=>`<button class="choice" data-i="${i}">${v}</button>`).join('')+'</div>';a.querySelectorAll('button').forEach(b=>b.onclick=()=>check(+b.dataset.i===t.correct))}
if(t.type==='number'){a.innerHTML='<label for="num">Skriv svaret:</label><div><input id="num" class="field" type="number" step="any" inputmode="decimal" placeholder="Ditt svar"></div><button class="action" id="check">Sjekk svaret</button>';$('#check').onclick=()=>{let s=$('#num').value.replace(',','.');if(s.trim())check(Math.abs(Number(s)-t.correct)<1e-8)};$('#num').onkeydown=e=>{if(e.key==='Enter')$('#check').click()}}
if(t.type==='table'){a.innerHTML='<div class="tableInputs">'+t.xs.map((x,i)=>`<label>x = ${x}<input type="number" step="any" inputmode="decimal" aria-label="y når x er ${x}" data-i="${i}" placeholder="y = ?"></label>`).join('')+'</div><button class="action" id="check">Sjekk tabellen</button>';$('#check').onclick=()=>{let inputs=[...a.querySelectorAll('input')];if(inputs.some(el=>!el.value.trim()))return;check(inputs.every((el,i)=>Math.abs(Number(el.value.replace(',','.'))-t.ys[i])<1e-8))}}
if(t.type==='click')$('#diagram').querySelectorAll('.hit').forEach(el=>el.onclick=()=>{let x=+el.dataset.x,y=+el.dataset.y;$('#diagram').innerHTML=svg(t,[x,y])+'<small>Hver rute er én enhet</small>';check(x===t.point[0]&&y===t.point[1]);});$('#next').onclick=()=>{index++;answered=false;wrong=0;render()}}
function check(ok){if(answered)return;if(ok){answered=true;if(!wrong)score++;$('#feedback').innerHTML=`<div class="feedback ok"><strong>✓ Riktig!</strong>${tasks[level][index].explain}</div>`;$('#next').style.display='inline-block';$('#answer').querySelectorAll('button,input').forEach(x=>x.disabled=true);if(tasks[level][index].type==='click')$('#diagram').innerHTML=svg(tasks[level][index])+'<small>Riktig punkt er markert</small>'}else{wrong++;$('#feedback').innerHTML=`<div class="feedback"><strong>Prøv igjen!</strong>${wrong>=2?tasks[level][index].explain:'Se på aksene og tenk gjennom hva som er x og y. Du kan forsøke på nytt.'}</div>`;if(tasks[level][index].type==='click')$('#diagram').innerHTML=svg(tasks[level][index])+'<small>Trykk på et annet punkt</small>', $('#diagram').querySelectorAll('.hit').forEach(el=>el.onclick=()=>{let x=+el.dataset.x,y=+el.dataset.y;check(x===tasks[level][index].point[0]&&y===tasks[level][index].point[1])})}}
}
function start(n){level=n;index=0;score=0;answered=false;wrong=0;document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',+b.dataset.level===n));render()}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));render();
</script></body></html>
