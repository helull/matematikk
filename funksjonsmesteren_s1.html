if(s===3){const h=rand(-3,3),k=rand(-2,3),aa=pick([-2,-1,1,2]),absgraph=G([{fn:t=>aa*Math.abs(t-h)+k,color:'#6547bc'}],{ymin:-8,ymax:10});
if(l===0){add(val('Hvor ligger bunnpunktet på x-aksen for f(x)=|x−2|?',2,'Bunnen er der x−2=0, altså x=2.',{graph:G([{fn:t=>Math.abs(t-2),color:'#6547bc'}])}));add(val('Hva er minste verdi for f(x)=|x|+3?',3,'Minste absoluttverdi er 0, og 0+3=3.'));add(mc('Hvordan flyttes f(x)=|x| når vi får |x+2|?','2 mot venstre',['2 mot venstre','2 mot høyre','2 opp','2 ned'],'Bunnpunktet blir (−2,0).'));add(mc('Hva betyr +4 utenfor absoluttverdien i |x|+4?','4 opp',['4 opp','4 ned','4 mot høyre','4 mot venstre'],'Alle funksjonsverdiene øker med 4.'));add(val('Hva er f(1) for f(x)=|x−3|+2?',4,'|1−3|+2=2+2=4.'));add(val('Hva er minste verdi til f(x)=|x−1|−2?',-2,'Absoluttverdien kan bli 0 ved x=1.'));}
if(l===1){add(mc('Hva skjer med f(x)=−|x|?','V-en snus opp ned',['V-en snus opp ned','Den flyttes mot høyre','Den flyttes opp','Den blir vannrett'],'Minustegnet speiler grafen om x-aksen.',{graph:G([{fn:t=>-Math.abs(t),color:'#6547bc'}])}));add(val('Finn f(−2) når f(x)=3|x|.',6,'3·|−2|=6.'));add(val('Finn f(2) når f(x)=−2|x|+1.',-3,'−2·2+1=−3.'));add(mc('Hva skjer når 2|x| erstatter |x|?','Grafen blir brattere',['Grafen blir brattere','Grafen blir flatere','Grafen flyttes mot høyre','Grafen forsvinner'],'Alle y-verdier dobles.'));add(mc('Hva er største verdi til f(x)=−|x|+3?','3',['3','0','−3','Ingen største verdi'],'Opp-ned-V-en har toppunkt med y=3.'));add(val('Hva er f(−1) når f(x)=−|x+1|+4?',4,'Inni absoluttverdien blir −1+1=0.'));}
if(l===2){add(val('Løs |x|=4. Hva er den positive løsningen?',4,'|x|=4 betyr x=4 eller x=−4.'));add(val('Løs |x−3|=2. Hva er den minste løsningen?',1,'x−3=2 eller x−3=−2. Dermed x=5 eller x=1.'));add(val('Løs |x+2|=3. Hva er den største løsningen?',1,'x+2=3 eller x+2=−3. Dermed x=1 eller x=−5.'));add(mc('Hvor mange løsninger har |x|=−2?','0',['0','1','2','Uendelig mange'],'Absoluttverdi er aldri negativ.'));add(mc('Hvor mange løsninger har |x−2|=0?','1',['1','0','2','3'],'Bare x=2 gir avstand null.'));add(val('Løs |x−1|=3. Hva er den minste løsningen?',-2,'x−1=3 eller x−1=−3, altså x=4 eller x=−2.'));}
if(l===3){add(mc('Hvilken delt forskrift tilsvarer |x|?','−x for x < 0; x for x ≥ 0',['−x for x < 0; x for x ≥ 0','x for alle x','x for x < 0; −x for x ≥ 0','−x for alle x'],'Når x er negativt, skifter vi fortegn. Ellers beholder vi x.',{piece:{rules:[['−x','x < 0'],['x','x ≥ 0']]}}));add(val('Hva er bruddpunktets x-verdi i f(x)=|x−4|?',4,'Regelen skifter der x−4=0.'));add(mc('Hvilken regel gjelder for |x−2| når x < 2?','2−x',['2−x','x−2','x+2','−x−2'],'Når x−2 er negativt, snur absoluttverdien fortegnet.'));add(val('Løs |x−2|=3. Hva er minste løsning?',-1,'x−2=3 eller x−2=−3.'));add(mc('Hva er verdimengden til f(x)=−|x−1|+2 for alle reelle x?','y ≤ 2',['y ≤ 2','y ≥ 2','y > 2','y ≥ 0'],'Grafen har toppunkt med y=2.'));add(val('Finn f(−2) for f(x)=|2x+1|.',3,'2·(−2)+1=−3, og |−3|=3.'));}}

return out.sort(()=>Math.random()-.5)}
function render(){if(!state.step){home();return}if(!state.level){levels();return}exercise()}
function home(){app.innerHTML=`<section class="panel"><h2>Velkommen til funksjonslaboratoriet! 🔬</h2><p>Start med det grunnleggende, eller velg et steg du vil øve på. Hvert steg har fire nivåer, med forklaringer, grafer og fasit underveis.</p><div class="note">💡 Du kan øve helt anonymt. Ingen resultater sendes til en server. Poeng gjelder denne økten.</div></section><div class="grid">${stages.map((s,i)=>`<button class="tile" data-step="${i+1}"><span class="pill">STEG ${i+1}</span><strong>${s.icon} ${s.name}</strong><small>${s.desc}</small></button>`).join('')}</div><section class="panel"><h2>📚 Fakta-ark</h2><p class="muted">Korte forklaringer, eksempler og figurer. Kan også skrives ut.</p><div class="actions"><button class="secondary" id="facts">Åpne fakta-ark</button></div></section>`;app.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{state.step=+el.dataset.step;state.level=0;render()});document.getElementById('facts').onclick=facts}
function levels(){let s=stages[state.step-1];app.innerHTML=`<div class="actions"><button class="secondary" id="back">← Alle steg</button><button class="secondary" id="facts">📚 Fakta-ark</button></div><section class="panel"><h2>${s.icon} Steg ${state.step}: ${s.name}</h2><p>${s.desc}</p></section><div class="grid">${s.levels.map((t,i)=>`<button class="tile" data-level="${i+1}"><span class="pill">NIVÅ ${i+1}</span><strong>${t}</strong><small>${i===0?'Rolig start':i===1?'Nå bruker vi det du kan':i===2?'Litt mer å tenke på':'Utfordringer for S1'}</small></button>`).join('')}</div>`;document.getElementById('back').onclick=()=>{state.step=0;render()};document.getElementById('facts').onclick=facts;app.querySelectorAll('[data-level]').forEach(el=>el.onclick=()=>start(+el.dataset.level))}
function start(level){state.level=level;state.index=0;state.score=0;state.attempts=0;state.done=false;state.hint=false;state.questions=generate(state.step,level);if(!state.questions.length){alert('Dette nivået mangler oppgaver.');return}exercise()}
function pieceHTML(p){return `<div class="math" style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.2rem"><span>f(x) =</span><span style="font-size:3.4rem;font-weight:300;line-height:1">{</span><span style="display:grid;gap:7px;text-align:left">${p.rules.map(r=>`<span>${r[0]} <span style="font-size:.78rem;font-weight:500;color:#55647b">når ${r[1]}</span></span>`).join('')}</span></div>`}
function graphSVG(g){const W=600,H=360,P=44,xmin=g.xmin??-6,xmax=g.xmax??6,ymin=g.ymin??-8,ymax=g.ymax??10;const X=t=>P+(t-xmin)/(xmax-xmin)*(W-2*P),Y=t=>H-P-(t-ymin)/(ymax-ymin)*(H-2*P);let lines='';for(let x=Math.ceil(xmin);x<=xmax;x++)lines+=`<line x1="${X(x)}" y1="${P}" x2="${X(x)}" y2="${H-P}" stroke="${x===0?'#334155':'#e7ecf5'}" stroke-width="${x===0?2:1}"/><text x="${X(x)}" y="${Y(0)+15}" font-size="11" text-anchor="middle" fill="#64748b">${x===0?'':x}</text>`;for(let y=Math.ceil(ymin);y<=ymax;y+=2)lines+=`<line x1="${P}" y1="${Y(y)}" x2="${W-P}" y2="${Y(y)}" stroke="${y===0?'#334155':'#e7ecf5'}" stroke-width="${y===0?2:1}"/><text x="${X(0)-8}" y="${Y(y)+4}" font-size="11" text-anchor="end" fill="#64748b">${y}</text>`;let paths='';g.funcs.forEach((f,i)=>{let lo=Math.max(xmin,f.domain?.[0]??g.domain?.[0]??xmin),hi=Math.min(xmax,f.domain?.[1]??g.domain?.[1]??xmax);let pts=[];for(let j=0;j<=300;j++){let t=lo+(hi-lo)*j/300,v=f.fn(t);if(Number.isFinite(v))pts.push(`${j?'L':'M'}${X(t).toFixed(2)},${Y(v).toFixed(2)}`)}paths+=`<path d="${pts.join(' ')}" fill="none" stroke="${f.color||'#6547bc'}" stroke-width="3.5" clip-path="url(#clip)"/>`;if(f.domain){for(const [side,open] of [['Start',f.openStart],['End',f.openEnd]]){let t=side==='Start'?lo:hi,v=f.fn(t);if(Number.isFinite(v)&&v>=ymin&&v<=ymax){const cx=X(t),cy=Y(v),col=f.color||'#6547bc',sideSign=side==='Start'?-1:1;if(open){const ex=cx+sideSign*15,ey=cy;paths+=`<path d="M ${cx-sideSign*3} ${cy} L ${ex} ${ey} M ${ex-sideSign*7} ${ey-6} L ${ex} ${ey} L ${ex-sideSign*7} ${ey+6}" stroke="${col}" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`}else{const hook=side==='Start'?7:-7;paths+=`<path d="M ${cx+hook} ${cy-9} H ${cx} V ${cy+9} H ${cx+hook}" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`}}}}if(f.label)paths+=`<text x="${W-P-50}" y="${P+20+i*24}" fill="${f.color}" font-weight="700">${f.label}</text>`});return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Koordinatsystem med funksjonsgraf"><defs><clipPath id="clip"><rect x="${P}" y="${P}" width="${W-2*P}" height="${H-2*P}"/></clipPath></defs>${lines}${paths}<text x="${W-P+9}" y="${Y(0)-8}" font-size="15">x</text><text x="${X(0)+10}" y="${P-12}" font-size="15">y</text></svg>`}
function tableHTML(t){return `<table><tr><th>x</th>${t.xs.map(x=>`<td>${x}</td>`).join('')}</tr><tr><th>f(x)</th>${t.xs.map(x=>`<td>${x===t.missing?'?':fmt(t.a*x+t.b)}</td>`).join('')}</tr></table>`}
function exercise(){let s=stages[state.step-1],qq=state.questions[state.index];if(!qq){finish();return}let total=state.questions.length;app.innerHTML=`<div class="actions"><button class="secondary" id="back">← Nivåer</button><button class="secondary" id="facts">📚 Fakta-ark</button></div><section class="panel"><div class="muted">${s.icon} ${s.name} · Nivå ${state.level}: ${s.levels[state.level-1]}</div><div class="stats"><span>Oppgave <b>${state.index+1}/${total}</b></span><span>⭐ Poeng <b>${state.score}</b></span></div><div class="progress"><div style="width:${state.index/total*100}%"></div></div><p class="question">${qq.prompt}</p>${qq.formula?`<div class="math">${qq.formula}</div>`:''}${qq.piece?pieceHTML(qq.piece):''}${qq.graph?graphSVG(qq.graph):''}${qq.table?tableHTML(qq.table):''}<div id="inputArea">${qq.type==='choice'?`<div class="choices">${qq.options.map((o,i)=>`<button class="choice" data-choice="${i}">${o}</button>`).join('')}</div>`:`<label for="answer" class="muted">Skriv svaret ditt:</label><div style="margin-top:8px"><input class="answer" id="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="F.eks. −2 eller 1,5"></div>`}</div><div id="feedback" aria-live="polite"></div><div class="actions"><button class="primary" id="check" ${qq.type==='choice'?'disabled':''}>Sjekk svar</button><button class="secondary" id="hint">💡 Hint</button><button class="secondary hidden" id="next">Neste oppgave →</button></div></section>`;document.getElementById('back').onclick=()=>{state.level=0;render()};document.getElementById('facts').onclick=facts;let check=document.getElementById('check');if(qq.type==='choice'){app.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{app.querySelectorAll('[data-choice]').forEach(e=>{e.style.borderColor='#dce2f1';e.style.background='#f7f8fe'});el.style.borderColor='#5e4bc1';el.style.background='#edeaff';state.answer=qq.options[+el.dataset.choice];check.disabled=false})}else{let input=document.getElementById('answer');input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!check.disabled)check.click()})}document.getElementById('hint').onclick=()=>{document.getElementById('feedback').innerHTML=`<div class="feedback hint">💡 Tenk over hvilken regel eller hvilket intervall som gjelder. ${qq.graph?'Bruk grafen som hjelp.':''} Du kan prøve flere ganger.</div>`};check.onclick=()=>{let user=qq.type==='choice'?state.answer:document.getElementById('answer').value;let correct=qq.type==='choice'?user===qq.answer:eq(num(user),qq.answer);state.attempts++;if(correct){state.score+=state.attempts===1?3:state.attempts===2?2:1;document.getElementById('feedback').innerHTML=`<div class="feedback good">🎉 Riktig! ${qq.explain}</div>`;check.disabled=true;document.getElementById('hint').disabled=true;document.getElementById('next').classList.remove('hidden');state.done=true}else if(state.attempts>=3){document.getElementById('feedback').innerHTML=`<div class="feedback bad">Riktig svar: <b>${qq.type==='choice'?qq.answer:fmt(qq.answer)}</b>.<br>${qq.explain}</div>`;check.disabled=true;document.getElementById('hint').disabled=true;document.getElementById('next').classList.remove('hidden');state.done=true}else{document.getElementById('feedback').innerHTML=`<div class="feedback bad">Ikke helt. Prøv igjen! (${3-state.attempts} forsøk igjen.)</div>`}};document.getElementById('next').onclick=()=>{state.index++;state.attempts=0;state.answer='';state.done=false;exercise()}}
function finish(){let max=state.questions.length*3;app.innerHTML=`<section class="panel" style="text-align:center"><h2>🏆 Nivå fullført!</h2><div style="font-size:3rem">${state.score>=max*.8?'🌟':'🎯'}</div><p>Du fikk <strong>${state.score} av ${max} poeng</strong>.</p><p>${state.score>=max*.8?'Supert! Du er klar for mer utfordring.':'Bra jobbet! Prøv gjerne nivået på nytt for å øve mer.'}</p><div class="actions" style="justify-content:center"><button class="primary" id="again">Spill nivået på nytt</button><button class="secondary" id="levels">Velg nivå</button></div></section>`;document.getElementById('again').onclick=()=>start(state.level);document.getElementById('levels').onclick=()=>{state.level=0;render()}}
function facts(){app.innerHTML=`<div class="actions"><button class="secondary" id="back">← Tilbake</button><button class="secondary" onclick="window.print()">🖨️ Skriv ut</button></div><section class="panel facts"><h2>📚 Fakta-ark: Funksjoner S1</h2><p>Dette arket samler de viktigste reglene og noen korte eksempler. Bruk det mens du øver.</p><h3>1. Hva er en funksjon?</h3><p>En funksjon gir <b>nøyaktig én y-verdi for hver tillatte x-verdi</b>. x er den <b>uavhengige variabelen</b>, og y=f(x) er den <b>avhengige variabelen</b>.</p><div class="math">f(x) = 2x + 1</div><p>Hvis x=3, er f(3)=2·3+1=7. Punktet på grafen er (3,7).</p><h3>2. Verditabell og graf</h3><table><tr><th>x</th><td>−1</td><td>0</td><td>1</td><td>2</td></tr><tr><th>f(x)</th><td>−1</td><td>1</td><td>3</td><td>5</td></tr></table>${graphSVG(G([{fn:x=>2*x+1,color:'#6547bc'}],{ymin:-5,ymax:9}))}<p>På x-aksen står den uavhengige variabelen. På y-aksen står funksjonsverdien. Tegn punktene (x,f(x)).</p><h3>3. Definisjonsmengde og verdimengde</h3><p><b>D</b> er alle tillatte x-verdier. <b>V</b> er alle y-verdiene som faktisk oppstår. Hvis f(x)=2x+1 og D: 0 ≤ x ≤ 3, så er V: 1 ≤ y ≤ 7.</p><p><span class="tag">a ≤ x ≤ b: lukket intervall i begge ender</span><span class="tag">a < x < b: åpent intervall i begge ender</span><span class="tag">a ≤ x < b: lukket ved a, åpent ved b</span></p><h3>4. Løse likninger med funksjoner</h3><p>Hvis f(x)=2x+1 og g(x)=−x+7, er skjæringspunktet der <b>f(x)=g(x)</b>. Da setter vi 2x+1=−x+7, får 3x=6 og dermed x=2. Setter vi inn x=2, får vi y=5. Skjæringspunktet er (2,5).</p>${graphSVG(G([{fn:x=>2*x+1,color:'#6547bc',label:'f'},{fn:x=>-x+7,color:'#e07038',label:'g'}],{ymin:-5,ymax:12}))}<h3>5. Delt forskrift</h3><p>En funksjon kan ha ulike regler for ulike x-intervaller. Skriv en <b>stor venstre krøllparentes</b>, med ett uttrykk og én betingelse på hver linje:</p>${pieceHTML({rules:[['x + 2','x < 1'],['3x','x ≥ 1']]})}<p>Ved x=1 brukes andre regel, fordi x≥1. Da er f(1)=3. Ved x=0 brukes første regel, og f(0)=2.</p><p><b>Bruddpunkt</b> er x-verdien der regelen skifter. Et <b>åpent intervall</b> markeres med <b>pil</b> ved endepunktet: grenseverdien er ikke med. Et <b>lukket intervall</b> markeres med <b>hakeparentes</b>: grenseverdien er med.</p>${graphSVG(G([{fn:x=>x+2,color:'#6547bc',domain:[-5,1],openEnd:true},{fn:x=>3*x,color:'#e07038',domain:[1,4],openStart:false}],{ymin:-6,ymax:12}))}<p class="note">Viktig: Et bruddpunkt trenger ikke gi et hopp. En delt forskrift kan også ha deler som møtes helt fint.</p><h3>6. Innføring i absoluttverdi</h3><p><b>|x|</b> betyr avstanden fra x til 0 på tallinjen. Derfor er |−4|=4 og |4|=4. Absoluttverdien er aldri negativ.</p><div class="math">f(x) = |x|</div>${graphSVG(G([{fn:x=>Math.abs(x),color:'#6547bc'}],{ymin:-2,ymax:8}))}<p>Grafen er V-formet. Først lærer du avstand fra null, så hvordan verdiene tegnes i et koordinatsystem. Bunnpunktet til |x−h|+k er (h,k). Uttrykket −|x| gir en opp-ned-V.</p><h3>7. Absoluttverdi som delt forskrift</h3>${pieceHTML({rules:[['−x','x < 0'],['x','x ≥ 0']]})}<p>For negative x bytter vi fortegn. For x≥0 beholder vi x.</p><h3>8. Absoluttverdilikninger</h3><p>|x−3|=2 betyr at avstanden fra x til 3 er 2. Da er x=1 eller x=5. Likningen |x|=−2 har ingen løsninger.</p><div class="note">Husk: Sett alltid inn et x-tall i riktig del av forskriften, og kontroller om endepunktet er åpent intervall eller lukket intervall.</div></section>`;document.getElementById('back').onclick=render}
render();
</script></body></html>
