<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14283c">
<title>Matematikk – Helges læringsportal</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17283c;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f5f7fb}
main{width:min(920px,calc(100% - 24px));margin:auto;padding:18px 0 30px}
.back{display:inline-block;margin:0 0 10px;color:#48617b;text-decoration:none;font-size:.85rem;font-weight:650}
.back:hover{text-decoration:underline}
header{background:linear-gradient(125deg,#14283c,#294a67);color:white;border-radius:17px;padding:19px 21px;margin-bottom:16px;box-shadow:0 8px 20px #14283c15}
h1,header h1{font-size:clamp(1.55rem,4vw,2.15rem);letter-spacing:-.04em;margin:0 0 4px}
header p{margin:0;color:#d9e6f3;font-size:.83rem;line-height:1.35}
section{margin-bottom:17px}
section>h2{font-size:1rem;margin:0 0 9px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:126px;padding:13px 9px;border-radius:15px;text-align:center;text-decoration:none;border:1px solid transparent;transition:transform .18s ease,box-shadow .18s ease}
.card:hover:not(.disabled){transform:translateY(-3px);box-shadow:0 9px 18px #15283c17}
.card:focus-visible{outline:3px solid #15283c;outline-offset:3px}
.card h2,.card strong{font-size:clamp(1.08rem,4.8vw,1.65rem);font-weight:800;line-height:1.12;letter-spacing:-.03em;margin:0;overflow-wrap:anywhere}
.card .description,.card small{font-size:.69rem;line-height:1.3;margin:6px 0 0;opacity:.82}
.card .destination,.card .go{font-size:.67rem;font-weight:750;margin-top:9px;padding:0}
.card .icon,.card .symbol{display:none}
.card.math,.card.course,.card.student{background:#e9f2ff;color:#173b72;border-color:#d6e5fb}
.card.schedule,.card.other,.card.teacher{background:#e6f6ef;color:#175c40;border-color:#d3ebdf}
.card.games,.card.triangle,.card.admin{background:#f2eaff;color:#56318a;border-color:#e6d6fc}
.card.admin-gray{background:#ebedf1;color:#3d4959;border-color:#d9dce2}
.card.disabled{opacity:.65;cursor:default}
.status{padding:10px 12px;background:white;border:1px solid #dbe3ed;border-radius:10px;color:#51647b;font-size:.8rem}
.retry{font:inherit;border:0;border-radius:8px;padding:7px 10px;margin-left:6px;cursor:pointer;background:#dbeafe;color:#173b72}
footer{text-align:center;color:#64748b;margin-top:18px;font-size:.72rem}
[hidden]{display:none!important}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{min-height:145px;padding:18px 12px}}
@media(max-width:380px){main{width:calc(100% - 18px)}.cards{gap:8px}.card{min-height:118px;padding:10px 6px}.card h2,.card strong{font-size:1.06rem}.card .description,.card small{font-size:.65rem}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover:not(.disabled){transform:none}}

</style>
<style>main > header, .shell > header.top{padding-right:65px!important}</style>
</head>
<body>
<main>
<header><h1>Matematikk</h1><p>Velg fag eller utforsk interaktive matematikkaktiviteter.</p></header>
<section aria-labelledby="fag-title">
<h2 id="fag-title">Matematikkfag</h2>
<div id="courses" class="cards" aria-live="polite"></div>
</section>
<section aria-labelledby="triangle-title">
<h2 id="triangle-title">Utforsk matematikk</h2>
<div class="cards" id="special"></div>
</section>
<section id="others-section" aria-labelledby="others-title" hidden>
<h2 id="others-title">Andre ressurser</h2>
<div id="others" class="cards"></div>
</section>
<div id="status" class="status" role="status">Henter mapper fra GitHub …</div>
</main>
<script>
"use strict";
const api="https://api.github.com/repos/helull/matematikk/contents/";
const courseNames={"1p":"1P","1py":"1P-Y","2p":"2P","2py":"2P-Y","s1":"S1","s2":"S2","r1":"R1","r2":"R2","1t":"1T","1p-y":"1P-Y","2p-y":"2P-Y"};
const isCourse=name=>/^(?:[12](?:p|py|p-y|t)|[sr][12])$/i.test(name);
const label=name=>courseNames[name.toLowerCase()]||name.toLocaleUpperCase("no");
const root=document.getElementById("courses");
const special=document.getElementById("special");
const others=document.getElementById("others");
const otherSection=document.getElementById("others-section");
const status=document.getElementById("status");
function card(name,title,description,kind,enabled=true){
 const el=document.createElement(enabled?"a":"div");
 el.className="card "+kind+(enabled?"":" disabled");
 if(enabled)el.href="./"+encodeURIComponent(name)+"/";
 const heading=document.createElement("strong");heading.textContent=title;
 const desc=document.createElement("small");desc.textContent=description;
 const go=document.createElement("span");go.className="go";go.textContent=enabled?"Åpne →":"Kommer snart";
 el.append(heading,desc,go);return el;
}
function render(items){
 const dirs=items.filter(x=>x.type==="dir").map(x=>x.name);
 root.replaceChildren();others.replaceChildren();special.replaceChildren();
 const courseDirs=dirs.filter(isCourse).sort((a,b)=>a.localeCompare(b,"no",{numeric:true}));
 const extraDirs=dirs.filter(x=>x!=="trekant"&&!isCourse(x)).sort((a,b)=>a.localeCompare(b,"no",{numeric:true}));
 for(const name of courseDirs)root.append(card(name,label(name),"Oppgaver og aktiviteter i "+label(name)+".","course"));
 if(!courseDirs.length){const msg=document.createElement("p");msg.textContent="Ingen fagmapper funnet ennå.";root.append(msg)}
 special.append(card("trekant","Helges trekant","Utforsk trekanter med interaktive oppgaver.","triangle",dirs.includes("trekant")));
 for(const name of extraDirs)others.append(card(name,label(name),"Se innholdet i mappen.","other"));
 otherSection.hidden=extraDirs.length===0;
 status.hidden=true;
}
async function load(){
 status.hidden=false;status.textContent="Henter mapper fra GitHub …";
 try{
  const response=await fetch(api,{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);
  const items=await response.json();
  if(!Array.isArray(items))throw Error("Uventet svar");
  render(items);
 }catch(error){
  status.replaceChildren();
  status.append(document.createTextNode("Kunne ikke hente mappene akkurat nå. "));
  const retry=document.createElement("button");retry.className="retry";retry.type="button";retry.textContent="Prøv igjen";retry.addEventListener("click",load);
  status.append(retry);
  special.replaceChildren(card("trekant","Helges trekant","Trekantoppgaver.","triangle",false));
 }
}
load();
</script>
<script defer src="https://helull.github.io/portal-menu.js?v=20261122-2"></script>
</body>
</html>
