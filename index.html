<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14283c">
<title>Matematikk – Helges læringsportal</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#182d45;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;min-height:100vh}
main{width:min(980px,calc(100% - 32px));margin:auto;padding:clamp(24px,5vw,58px) 0 44px}
.back{display:inline-flex;align-items:center;gap:8px;color:#48617b;text-decoration:none;font-weight:650;margin-bottom:18px}
.back:hover{text-decoration:underline}
header{background:linear-gradient(125deg,#14283c,#294a67);border-radius:24px;padding:clamp(26px,5vw,46px);color:white;box-shadow:0 12px 30px #14283c18;margin-bottom:27px}
header h1{font-size:clamp(2rem,5vw,3.1rem);letter-spacing:-.045em;margin:0 0 9px}
header p{margin:0;color:#d9e6f3;font-size:1.07rem;line-height:1.5}
section{margin-bottom:27px}
h2{font-size:1.2rem;letter-spacing:-.02em;margin:0 0 13px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{display:flex;flex-direction:column;min-height:188px;border-radius:20px;padding:23px;background:#e9f2ff;color:#173b72;text-decoration:none;border:1px solid #d6e5fb;transition:transform .18s,box-shadow .18s}
.card:hover:not(.disabled){transform:translateY(-4px);box-shadow:0 12px 26px #15283c18}
.card:focus-visible{outline:3px solid #17283c;outline-offset:3px}
.card .symbol{font-size:26px;display:grid;place-items:center;background:#ffffffb0;border-radius:12px;width:46px;height:46px;margin-bottom:15px}
.card strong{font-size:1.38rem;letter-spacing:-.025em}
.card small{font-size:.91rem;line-height:1.5;margin-top:7px;opacity:.84}
.card .go{font-size:.84rem;font-weight:750;margin-top:auto;padding-top:18px}
.card.triangle{background:#f2eaff;color:#59358b;border-color:#e6d6fc}
.card.other{background:#e6f6ef;color:#175c40;border-color:#d3ebdf}
.card.disabled{opacity:.72;cursor:default}
.status{padding:15px 18px;background:white;border:1px solid #dbe3ed;border-radius:14px;color:#51647b}
.retry{font:inherit;border:0;border-radius:8px;padding:8px 12px;margin-left:8px;cursor:pointer;background:#dbeafe;color:#173b72}
[hidden]{display:none!important}
@media(max-width:720px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:490px){.cards{grid-template-columns:1fr}.card{min-height:155px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover:not(.disabled){transform:none}}
</style>
</head>
<body>
<main>
<a class="back" href="../">← Til hovedmenyen</a>
<header><h1>Matematikk</h1><p>Velg fag eller utforsk interaktive matematikkaktiviteter.</p></header>
<section aria-labelledby="fag-title">
<h2 id="fag-title">Matematikkfag</h2>
<div id="courses" class="cards" aria-live="polite"></div>
</section>
<section aria-labelledby="triangle-title">
<h2 id="triangle-title">Utforsk matematikk</h2>
<div class="cards" id="special"></div>
</section>
<section id="others-section" aria-labelledby="others-title" hidden>
<h2 id="others-title">Andre ressurser</h2>
<div id="others" class="cards"></div>
</section>
<div id="status" class="status" role="status">Henter mapper fra GitHub …</div>
</main>
<script>
"use strict";
const api="https://api.github.com/repos/helull/matematikk/contents/";
const courseNames={"1p":"1P","1py":"1P-Y","2p":"2P","2py":"2P-Y","s1":"S1","s2":"S2","r1":"R1","r2":"R2","1t":"1T","1p-y":"1P-Y","2p-y":"2P-Y"};
const isCourse=name=>/^(?:[12](?:p|py|p-y|t)|[sr][12])$/i.test(name);
const label=name=>courseNames[name.toLowerCase()]||name.replace(/[-_]/g," ").replace(/^./,c=>c.toUpperCase());
const root=document.getElementById("courses");
const special=document.getElementById("special");
const others=document.getElementById("others");
const otherSection=document.getElementById("others-section");
const status=document.getElementById("status");
function card(name,title,description,kind,enabled=true){
 const el=document.createElement(enabled?"a":"div");
 el.className="card "+kind+(enabled?"":" disabled");
 if(enabled)el.href="./"+encodeURIComponent(name)+"/";
 const symbol=document.createElement("span");symbol.className="symbol";symbol.setAttribute("aria-hidden","true");symbol.textContent=kind==="triangle"?"△":kind==="other"?"📚":"∑";
 const heading=document.createElement("strong");heading.textContent=title;
 const desc=document.createElement("small");desc.textContent=description;
 const go=document.createElement("span");go.className="go";go.textContent=enabled?"Åpne →":"Kommer snart";
 el.append(symbol,heading,desc,go);return el;
}
function render(items){
 const dirs=items.filter(x=>x.type==="dir").map(x=>x.name);
 root.replaceChildren();others.replaceChildren();special.replaceChildren();
 const courseDirs=dirs.filter(isCourse).sort((a,b)=>a.localeCompare(b,"no",{numeric:true}));
 const extraDirs=dirs.filter(x=>x!=="trekant"&&!isCourse(x)).sort((a,b)=>a.localeCompare(b,"no",{numeric:true}));
 for(const name of courseDirs)root.append(card(name,label(name),"Oppgaver og aktiviteter i "+label(name)+".","course"));
 if(!courseDirs.length){const msg=document.createElement("p");msg.textContent="Ingen fagmapper funnet ennå.";root.append(msg)}
 special.append(card("trekant","Helges trekant","Utforsk trekanter med interaktive oppgaver.","triangle",dirs.includes("trekant")));
 for(const name of extraDirs)others.append(card(name,label(name),"Se innholdet i mappen.","other"));
 otherSection.hidden=extraDirs.length===0;
 status.hidden=true;
}
async function load(){
 status.hidden=false;status.textContent="Henter mapper fra GitHub …";
 try{
  const response=await fetch(api,{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);
  const items=await response.json();
  if(!Array.isArray(items))throw Error("Uventet svar");
  render(items);
 }catch(error){
  status.replaceChildren();
  status.append(document.createTextNode("Kunne ikke hente mappene akkurat nå. "));
  const retry=document.createElement("button");retry.className="retry";retry.type="button";retry.textContent="Prøv igjen";retry.addEventListener("click",load);
  status.append(retry);
  special.replaceChildren(card("trekant","Helges trekant","Trekantoppgaver.","triangle",false));
 }
}
load();
</script>
</body>
</html>
