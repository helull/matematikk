<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title>Programoversikt</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="top">
      <p class="eyebrow">PROGRAMOVERSIKT</p>
      <h1 id="heading">Programmer</h1>
      <p class="intro">Velg et program for å åpne det.</p>
      <div class="toolbar"><span id="status" role="status" aria-live="polite">Henter programmer …</span><button id="refresh" type="button">Oppdater</button></div>
    </header>
    <section id="cards" class="cards" aria-label="Tilgjengelige programmer"></section>
    <p id="error" class="error" hidden></p>
  </main>
</body>
</html>
