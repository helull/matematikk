<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spørsmålsbanken</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#edf2f7;color:#183047;margin:0}main{max-width:1100px;margin:auto;padding:18px}section,aside{background:white;border-radius:14px;padding:16px}article{display:grid;grid-template-columns:280px 1fr;gap:14px}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #bccbd8;border-radius:7px}input:not([type=checkbox],[type=radio]),textarea,select{width:100%}label{display:block;margin:10px 0 4px}button{cursor:pointer;background:#e7eef5}button.primary{background:#176849;color:white}#list{max-height:65vh;overflow:auto}#list button{display:block;width:100%;text-align:left;margin:4px 0}#list .selected{background:#cde8ff}#preview{background:#102332;color:white;padding:15px;border-radius:12px}#preview img,#preview svg{max-width:100%;max-height:240px}#status{min-height:24px;color:#176849} .options{display:grid;grid-template-columns:25px 1fr;align-items:center;gap:6px} @media(max-width:650px){article{grid-template-columns:1fr}#list{max-height:180px}}</style><main><h1>Spørsmålsbanken</h1><p>Velg spørsmålsbank</p><select id="bankSelect"><option value="trekanter">1PY</option></select><p><button id="copyBank">Ny bank fra valgt bank</button> <button id="emptyBank">Ny tom bank</button></p><details><summary>✨ Lag spørsmål med KI</summary><textarea id="aiPrompt" placeholder="Beskriv tema, nivå, antall og ønskede figurer"></textarea><button id="aiCopy">Kopier KI-prompt</button><p>Lim prompten inn i ChatGPT, og lim JSON-svaret inn her:</p><textarea id="aiJson" placeholder="JSON med spørsmål"></textarea><button id="aiImport">Importer til valgt bank</button></details><div id="status"></div><article><aside><input id="search" placeholder="Søk i spørsmål"><label>Tema</label><select id="filter"><option value="">Alle</option><option value="1">Vinkler og begreper</option><option value="2">Pytagoras og 30–60–90</option><option value="3">Areal og omkrets</option></select><p><button id="new">+ Nytt spørsmål</button></p><div id="list"></div></aside><section><div id="form" hidden><strong id="qid"></strong><label>Spørsmål</label><textarea id="question" rows="3"></textarea><label>Tema</label><select id="topic"><option value="1">Vinkler og begreper</option><option value="2">Pytagoras og 30–60–90</option><option value="3">Areal og omkrets</option></select><label>Vanskelighetsgrad</label><select id="level"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label>Svaralternativer (marker riktig)</label><div class="options" id="opts"></div><label>Forklaring</label><textarea id="explanation" rows="3"></textarea><label>Illustrasjon</label><select id="figure"><option value="">Ingen</option><option value="right">Rettvinklet trekant ABC</option><option value="area">Trekant med høyde</option><option value="angle">Trekant med 30°</option><option value="outside">Utvendig høyde</option><option value="custom">Egen trekant</option><option value="image">Opplastet bilde</option></select><div id="builder" hidden><label>Toppunkt vannrett (0–240)</label><input id="vx" type="range" min="5" max="235" value="150"><label>Toppunkt høyde</label><input id="vy" type="range" min="10" max="100" value="25"><label>Grunnlinjens tekst</label><input id="bl"><label>Høydens tekst</label><input id="hl"><label>Skråsidens tekst</label><input id="sl"><label><input id="height" type="checkbox" checked> Vis høyde</label></div><input id="upload" type="file" accept="image/png,image/jpeg,image/webp" hidden><label><input type="checkbox" id="active"> Aktivt spørsmål</label><p><button class="primary" id="save">Lagre spørsmål</button> <button id="export">Eksporter JSON</button></p><h3>Forhåndsvisning</h3><div id="preview"></div></div></section></article></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>const figs={"right":"<svg viewBox=\"0 0 240 135\" width=\"100%\" style=\"max-height:150px\"><path d=\"M35 105 L205 105 L35 20 Z\" fill=\"#294d65\" stroke=\"white\" stroke-width=\"2\"/><path d=\"M35 91 H49 V105\" fill=\"none\" stroke=\"#ffca55\" stroke-width=\"2\"/><g fill=\"white\" font-size=\"14\"><text x=\"20\" y=\"122\">A</text><text x=\"210\" y=\"120\">B</text><text x=\"20\" y=\"18\">C</text></g></svg>","area":"<svg viewBox=\"0 0 240 135\" width=\"100%\" style=\"max-height:150px\"><path d=\"M25 110 L215 110 L155 20 Z\" fill=\"#294d65\" stroke=\"white\" stroke-width=\"2\"/><path d=\"M155 20 V110\" stroke=\"#ffca55\" stroke-dasharray=\"5 4\"/><path d=\"M155 99 H166 V110\" fill=\"none\" stroke=\"#ffca55\"/><g fill=\"white\" font-size=\"13\"><text x=\"100\" y=\"128\">grunnlinje</text><text x=\"160\" y=\"65\">høyde</text></g></svg>","angle":"<svg viewBox=\"0 0 240 135\" width=\"100%\" style=\"max-height:150px\"><path d=\"M25 110 L215 110 L160 32 Z\" fill=\"#294d65\" stroke=\"white\" stroke-width=\"2\"/><path d=\"M57 110 A32 32 0 0 0 53 94\" fill=\"none\" stroke=\"#ffca55\"/><text x=\"62\" y=\"99\" fill=\"white\" font-size=\"13\">30°</text></svg>","outside":"<svg viewBox=\"0 0 240 135\" width=\"100%\" style=\"max-height:150px\"><path d=\"M85 110 L215 110 L25 20 Z\" fill=\"#294d65\" stroke=\"white\" stroke-width=\"2\"/><path d=\"M25 20 V110 H85\" fill=\"none\" stroke=\"#ffca55\" stroke-dasharray=\"5 4\"/><path d=\"M25 99 H36 V110\" fill=\"none\" stroke=\"#ffca55\"/></svg>"};firebase.initializeApp({apiKey:"AIzaSyBxWbDN_HyCuVe0jd6BQgRM0p08qdKhcKQ",databaseURL:"https://th60-f50e3-default-rtdb.europe-west1.firebasedatabase.app",projectId:"th60-f50e3"});const banksRef=firebase.database().ref('sporsmalsbank'),$=x=>document.getElementById(x);let ref=banksRef.child('trekanter');let bank=[],current=null,pic='';const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function status(s){$('status').textContent=s}function list(){let query=$('search').value.toLowerCase(),topic=$('filter').value;$('list').replaceChildren();bank.filter(q=>(!topic||q.topic==topic)&&(q.id+' '+q.question).toLowerCase().includes(query)).forEach(q=>{let b=document.createElement('button');b.textContent=q.id+' · '+(q.active?'':'[Av] ')+q.question;b.className=current?.id===q.id?'selected':'';b.onclick=()=>edit(q);$('list').append(b)})}function edit(q){current=q;$('form').hidden=false;$('qid').textContent=q.id;for(const k of ['question','topic','level','explanation','figure'])$(k).value=q[k]??'';$('active').checked=q.active!==false;pic=q.image||'';let g=q.geometry||{};for(const [k,v] of Object.entries({vx:g.vx??150,vy:g.vy??25,bl:g.bl||'',hl:g.hl||'',sl:g.sl||''}))$(k).value=v;$('height').checked=g.height!==false;$('opts').replaceChildren();for(let i=0;i<4;i++){let r=document.createElement('input');r.type='radio';r.name='correct';r.value=i;r.checked=i===q.correct;let a=document.createElement('input');a.id='a'+i;a.value=q.options[i]||'';$('opts').append(r,a)}preview();list()}function read(){return {id:current.id,question:$('question').value,topic:+$('topic').value,level:+$('level').value,options:[0,1,2,3].map(i=>$('a'+i).value),correct:+(document.querySelector('input[name=correct]:checked')?.value??-1),explanation:$('explanation').value,figure:$('figure').value,active:$('active').checked,image:$('figure').value==='image'?pic:'',geometry:{vx:+$('vx').value,vy:+$('vy').value,bl:$('bl').value,hl:$('hl').value,sl:$('sl').value,height:$('height').checked}}}function preview(){if(!current)return;let q=read(),g=q.geometry;$('builder').hidden=q.figure!=='custom';$('upload').hidden=q.figure!=='image';let svg=q.figure==='custom'?'<svg viewBox="0 0 260 150" width="100%"><path d="M35 120 L225 120 L'+g.vx+' '+g.vy+' Z" fill="#294d65" stroke="white" stroke-width="2"/>'+(g.height?'<path d="M'+g.vx+' '+g.vy+' V120" stroke="#ffca55" stroke-dasharray="5 4"/><text x="'+(g.vx+5)+'" y="'+((g.vy+120)/2)+'" fill="white">'+esc(g.hl)+'</text>':'')+'<text x="130" y="140" fill="white" text-anchor="middle">'+esc(g.bl)+'</text><text x="'+((35+g.vx)/2)+'" y="'+((120+g.vy)/2-8)+'" fill="white">'+esc(g.sl)+'</text></svg>':figs[q.figure]||'';$('preview').innerHTML='<h3>'+esc(q.question)+'</h3>'+svg+q.options.map((a,i)=>'<p>'+(i===q.correct?'✓ ':'')+esc(a)+'</p>').join('')+'<small>'+esc(q.explanation)+'</small>';if(q.figure==='image'&&pic){let im=document.createElement('img');im.src=pic;$('preview').insertBefore(im,$('preview').children[1]||null)}}$('form').addEventListener('input',preview);$('search').oninput=list;$('filter').onchange=list;$('upload').onchange=()=>{let f=$('upload').files[0];if(!f)return;if(f.size>500000){status('Velg et bilde under 500 kB.');return}let reader=new FileReader();reader.onload=()=>{pic=reader.result;preview()};reader.readAsDataURL(f)};$('new').onclick=()=>edit({id:'T-'+crypto.randomUUID().slice(0,8),topic:1,level:2,question:'',options:['','','',''],correct:0,explanation:'',figure:'',active:true});$('save').onclick=async()=>{let q=read();if(!q.question.trim()||q.options.some(a=>!a.trim())||q.correct<0){status('Fyll ut spørsmål, fire svar og fasit.');return}try{await ref.child(q.id).set(q);current=q;status('Lagret i Firebase: '+q.id)}catch(e){status('Kunne ikke lagre: '+e.message)}};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(bank,null,2)],{type:'application/json'}));a.download='trekanter.json';a.click();URL.revokeObjectURL(a.href)};async function init(){try{let s=await ref.once('value');if(!s.exists()){let data=await fetch('trekanter.json').then(r=>r.json());await ref.update(Object.fromEntries(data.map(q=>[q.id,q])))}ref.on('value',s=>{bank=Object.values(s.val()||{});list();if(!current&&bank.length)edit(bank[0]);status(bank.length+' spørsmål i Firebase')},e=>status(e.message))}catch(e){status('Firebase: '+e.message);bank=await fetch('trekanter.json').then(r=>r.json());list();if(bank.length)edit(bank[0])}}function switchBank(key){ref.off();ref=banksRef.child(key);current=null;$('form').hidden=true;bank=[];ref.on('value',s=>{bank=Object.values(s.val()||{}).filter(q=>q&&q.id);list();if(!current&&bank.length)edit(bank[0]);status(bank.length+' spørsmål i valgt bank')},e=>status(e.message))}const registry=firebase.database().ref('sporsmalsbankRegister');registry.on('value',s=>{let selected=$('bankSelect').value;$('bankSelect').replaceChildren(new Option('1PY','trekanter'));for(const [key,v] of Object.entries(s.val()||{}))$('bankSelect').append(new Option(v.name,key));$('bankSelect').value=selected||'trekanter'});$('bankSelect').onchange=()=>switchBank($('bankSelect').value);async function newBank(copy){let name=prompt('Navn på ny spørsmålsbank');if(!name?.trim())return;let key='bank-'+crypto.randomUUID().slice(0,12);try{if(copy&&bank.length)await banksRef.child(key).set(Object.fromEntries(bank.map(q=>[q.id,q])));await registry.child(key).set({name:name.trim(),parent:copy?$('bankSelect').value:''});$('bankSelect').value=key;switchBank(key)}catch(e){status(e.message)}}$('copyBank').onclick=()=>newBank(true);$('emptyBank').onclick=()=>newBank(false);$('aiCopy').onclick=async()=>{let promptText='Lag matematikkspørsmål på norsk. Returner kun gyldig JSON-array. Hvert objekt skal ha question (tekst), options (fire ulike tekster), correct (indeks 0–3), explanation (tekst), topic (1 vinkler/begreper, 2 Pytagoras, 3 areal/omkrets), level (1–5), figure (tom tekst eller right, area, angle, outside). Kontroller fasit. Oppdrag: '+$('aiPrompt').value;try{await navigator.clipboard.writeText(promptText);status('KI-prompt kopiert. Åpne ChatGPT og lim inn.')}catch(e){status(e.message)}};$('aiImport').onclick=async()=>{try{let data=JSON.parse($('aiJson').value.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,''));if(!Array.isArray(data)||!data.length)throw Error('Forventer en JSON-liste');let updates={};for(let q of data){if(typeof q.question!=='string'||!Array.isArray(q.options)||q.options.length!==4||q.options.some(a=>typeof a!=='string'||!a.trim())||!Number.isInteger(q.correct)||q.correct<0||q.correct>3)throw Error('Ugyldig spørsmål eller fasit');let id='T-'+crypto.randomUUID().slice(0,12);updates[id]={id,question:q.question,options:q.options,correct:q.correct,explanation:String(q.explanation||''),topic:[1,2,3].includes(q.topic)?q.topic:1,level:Math.max(1,Math.min(5,Number(q.level)||2)),figure:['right','area','angle','outside'].includes(q.figure)?q.figure:'',active:false}}await ref.update(updates);status('Importert '+data.length+' spørsmål som inaktive. Kontroller og aktiver dem.')}catch(e){status(e.message)}};init();</script><script src="/portal-menu.js"></script></html>
