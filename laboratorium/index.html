<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematikklaboratoriet</title><style>body{background:#101d30;color:white;font:18px system-ui;margin:auto;max-width:850px;padding:24px}a{display:block;color:white;background:#253952;padding:24px;border-radius:14px;margin:12px 0;text-decoration:none}small{display:block;color:#bcd0e8;margin-top:8px}</style><h1>Matematikklaboratoriet</h1><p>Utforsk matematikk sammen – med mobiltelefoner og fysiske eksperimenter.</p><section id="cards"></section><script>fetch('https://api.github.com/repos/helull/matematikk/contents/laboratorium').then(r=>{if(!r.ok)throw Error();return r.json()}).then(files=>{for(const f of files){if(f.type!=='file'||!f.name.endsWith('.html')||['index.html','stigningstall.html'].includes(f.name))continue;let a=document.createElement('a');a.href=encodeURIComponent(f.name);a.textContent=f.name.slice(0,-5).replace(/[-_]/g,' ');document.getElementById('cards').append(a)}}).catch(()=>{});</script></html>
