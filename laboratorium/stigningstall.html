<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stigningstall-laboratoriet</title><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#101d30;color:white;font:18px system-ui}main{max-width:850px;margin:auto;padding:24px}button,input{font:inherit;padding:12px;border-radius:10px;border:0;margin:5px}button{cursor:pointer;background:#dbeafe;color:#10233c}a{color:#bfdbfe}#unit{position:fixed;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden}#unit i{position:absolute;background:white;border-radius:3px}#unit b{position:absolute;font-size:clamp(24px,7vmin,60px);background:#0005;padding:10px;border-radius:10px}#unit button{position:absolute;right:8px;top:8px;font-size:14px}#unit small{position:absolute;bottom:8px;left:8px}#qr{background:white;padding:12px;width:max-content;margin:12px 0}svg{width:100%;max-height:45vh;background:#182a42;border-radius:14px}#stats{display:flex;gap:12px;flex-wrap:wrap}#stats span{background:#253952;padding:12px;border-radius:10px}#fraction{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 8px}#fraction b:first-child{border-bottom:2px solid white}#result{font-size:32px} [hidden]{display:none!important}</style><main id="main"><a href="./">← Laboratoriet</a><h1>Stigningstall-laboratoriet</h1><p>Bygg en stigning med telefoner. Én telefon = én enhet.</p><section id="start"><button id="host">Start lærerøkt</button><p>Elev: skriv inn øktkoden eller skann lærerens QR-kode.</p><input id="code" placeholder="Øktkode" maxlength="12" autocomplete="off"><button id="join">Bli med</button></section><p id="status" role="status"></p><section id="teacher" hidden><h2>Økt <span id="room"></span></h2><div id="qr"></div><a id="invite">Elevlenke</a> <button id="copy">Kopier lenke</button><div id="stats"><span id="count"></span><span id="xs" style="color:#93c5fd"></span><span id="ys" style="color:#86efac"></span></div><p id="result">a = <span id="fraction"><b id="num">0</b><b id="den">0</b></span> <span id="value"></span></p><svg id="graph" viewBox="0 0 360 250" aria-label="Stigningstrekant"></svg><p id="task"></p><button id="challenge">Ny byggeoppgave</button><p>Plasser telefonene kant mot kant. Programmet teller orientering, ikke fysisk kontakt.</p></section></main><div id="unit"><i></i><b></b><button id="leave">Avslutt</button><small></small></div><script>
const $=id=>document.getElementById(id);let peer,conn,role,room,lock,timer;const members=new Map();const portrait=()=>matchMedia('(orientation: portrait)').matches;const status=s=>$('status').textContent=s;const prefix='matlab-slope-v1-';let last=0;function render(){let x=0,y=0;for(const m of members.values()){if(Date.now()-m.time>12000)continue;m.axis==='y'?y++:x++} $('count').textContent=(x+y)+' telefoner';$('xs').textContent='Δx = '+x;$('ys').textContent='Δy = '+y;$('num').textContent=y;$('den').textContent=x;$('value').textContent=x?'= '+(y/x).toLocaleString('nb-NO',{maximumFractionDigits:3}):'– ikke definert';let s=Math.min(280/Math.max(x,1),180/Math.max(y,1),45),a=35,b=215,c=a+x*s,d=b-y*s;let h='<path d="M35 15 V215 H345" stroke="#94a3b8" fill="none"/>';for(let i=0;i<x;i++)h+='<rect x="'+(a+i*s)+'" y="'+(b-8)+'" width="'+s+'" height="16" rx="3" fill="#2563eb" stroke="#bfdbfe"/>';for(let i=0;i<y;i++)h+='<rect x="'+(c-8)+'" y="'+(b-(i+1)*s)+'" width="16" height="'+s+'" rx="3" fill="#16a34a" stroke="#bbf7d0"/>';h+='<path d="M'+a+' '+b+' L'+c+' '+d+'" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 4"/><text x="340" y="235" fill="white">x</text><text x="15" y="20" fill="white">y</text>';$('graph').innerHTML=h}
function makePeer(id){if(typeof Peer==='undefined')throw Error('Kommunikasjonsbiblioteket kunne ikke lastes.');return id?new Peer(id):new Peer()}
function error(e){status('Tilkoblingsfeil: '+(e.type||e.message||'ukjent'));$('unit').querySelector('small').textContent='Tilkobling brutt – avslutt og prøv igjen';}
$('host').onclick=()=>{if(peer)return;role='host';room=Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('');try{peer=makePeer(prefix+room)}catch(e){error(e);return}peer.on('error',error);peer.on('open',()=>{$('start').hidden=true;$('teacher').hidden=false;$('room').textContent=room;let url=new URL(location.href);url.search='?room='+room;$('invite').href=url.href;try{new QRCode($('qr'),{text:url.href,width:160,height:160})}catch(e){$('qr').textContent='Bruk elevlenken'}status('Økten er åpen.');render();timer=setInterval(render,1000)});peer.on('connection',c=>{c.on('data',d=>{if(d&&['x','y'].includes(d.axis)){members.set(c.peer,{axis:d.axis,time:Date.now()});render()}});c.on('close',()=>{members.delete(c.peer);render()})})};
function update(){let p=portrait(),u=$('unit'),i=u.querySelector('i'),b=u.querySelector('b');u.style.background=p?'#15803d':'#1d4ed8';i.style.width=p?'5px':'100%';i.style.height=p?'100%':'5px';b.textContent=p?'Δy = 1':'Δx = 1';b.style.transform=p?'translateX(-85px)':'translateY(-48px)';if(conn&&conn.open)conn.send({axis:p?'y':'x'})}
async function wake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')lock=await navigator.wakeLock.request('screen')}catch(e){}}
$('join').onclick=()=>{if(peer)return;room=$('code').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(room)){status('Skriv inn en gyldig øktkode.');return}role='student';try{peer=makePeer()}catch(e){error(e);return}status('Kobler til …');peer.on('error',error);peer.on('open',()=>{conn=peer.connect(prefix+room,{reliable:true});conn.on('open',()=>{$('unit').style.display='flex';$('main').hidden=true;$('unit').querySelector('small').textContent='Økt '+room;update();wake();timer=setInterval(update,2000)});conn.on('error',error);conn.on('close',()=>error({message:'Økten er avsluttet'}))})};
addEventListener('resize',()=>{if(role==='student')update()});document.addEventListener('visibilitychange',()=>{if(role==='student'&&conn?.open){update();wake()}});$('leave').onclick=()=>{clearInterval(timer);conn?.close();peer?.destroy();location.href=location.pathname};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('invite').href);status('Lenken er kopiert.')}catch(e){status('Kopier elevlenken manuelt.')}};$('challenge').onclick=()=>{let tasks=['2','0,5','1','1,5','0','3','2/3'];$('task').textContent='Bygg stigningstallet '+tasks[Math.floor(Math.random()*tasks.length)]};let r=new URLSearchParams(location.search).get('room');if(r)$('code').value=r;
</script></html>
