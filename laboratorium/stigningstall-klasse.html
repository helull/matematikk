<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stigningstall – bygg med mobilen</title><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#101d30;color:white;font:18px system-ui}main{max-width:540px;margin:auto;padding:18px}button,input,select{font:inherit;padding:12px;border:0;border-radius:12px;margin:5px 0}button{background:#dbeafe;color:#10233c;font-weight:bold}button:disabled{opacity:.5}section{background:#253952;border-radius:16px;padding:16px;margin:12px 0}.big{width:100%}a{color:#bfdbfe}[hidden]{display:none!important}#qr{background:white;padding:10px;width:max-content;margin:auto}#axis,#origin{position:fixed;inset:0;display:grid;place-items:center;text-align:center;overflow:auto}#axis{background:#14532d}#axis.x{background:#1e40af}#axis.off{background:#374151}#line{position:absolute;background:white;width:6px;height:100%;pointer-events:none}#axis.x #line{width:100%;height:6px}#axis.off #line{display:none}#axis.lit{background:#22c55e}#axis.x.lit{background:#3b82f6}#axis.lit #line{box-shadow:0 0 24px 10px white}#axis.win{background:#16a34a}#axis.fail{background:#92400e}#label,#axisTask,#message{z-index:1;background:#0009;padding:8px;border-radius:8px}#label{position:absolute;top:8px;left:8px}#axisTask{position:absolute;bottom:12px;left:8px;max-width:65%}#pause{position:absolute;right:8px;bottom:8px}#origin{padding:12px;background:#172638}#origin>div{width:100%;max-width:450px}#test{width:min(45vmin,150px);aspect-ratio:1;border-radius:50%;background:#fbbf24;font-size:24px}#back{position:absolute;right:8px;top:8px}.frac{display:inline-grid;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .2em}.frac span:first-child{border-bottom:2px solid;padding:0 .3em}.math{font-size:clamp(20px,5vmin,32px);margin:10px}svg{width:100%;max-height:220px}
</style><main id="home"><a href="./">← Laboratoriet</a><h1>Stigningstall – bygg med mobilen</h1><section id="illustration"><svg viewBox="0 0 320 220" aria-label="Gruppeleder i origo"><g fill="#15803d" stroke="#86efac"><rect x="12" y="10" width="42" height="70" rx="5"/><rect x="12" y="80" width="42" height="70" rx="5"/></g><g fill="#2563eb" stroke="#93c5fd"><rect x="54" y="150" width="84" height="42" rx="5"/><rect x="138" y="150" width="84" height="42" rx="5"/><rect x="222" y="150" width="84" height="42" rx="5"/></g><rect x="12" y="150" width="42" height="65" rx="5" fill="#475569" stroke="white"/><path d="M33 13V147 M57 171H303" stroke="white" stroke-width="3"/><circle cx="33" cy="171" r="15" fill="#fbbf24"/><text x="33" y="175" text-anchor="middle" font-size="11">O</text><path d="M120 110L49 158" stroke="#fbbf24" stroke-width="2"/><g fill="white" font-size="13"><text x="125" y="96">Gruppelederens telefon</text><text x="125" y="113">skal ligge i origo</text><text x="65" y="45">Δy</text><text x="170" y="211">Δx</text></g></svg><p>Legg telefonene kant mot kant. Stående = y, liggende = x. Slå av rotasjonslåsen.</p></section><button class="big" id="create">Opprett gruppe</button><section><input id="code" placeholder="Gruppekode" maxlength="6" style="width:100%;text-transform:uppercase"><button class="big" id="join">Bli med i gruppe</button></section><p id="status" role="status"></p></main>
<main id="lobby" hidden><h1>Din gruppe</h1><section><div id="qr"></div><h2 id="roomLabel"></h2><a id="invite">Elevlenke</a><p>Skann QR-koden. Gruppelederens telefon skal ligge i origo.</p><div id="lobbyPicture"></div><p id="count"></p></section><section><label>Nivå <select id="level"><option value="1">1 – Δy og Δx</option><option value="2" selected>2 – Brøk</option><option value="3">3 – Desimaltall</option><option value="4">4 – Færrest mulig</option><option value="5">5 – To ulike figurer</option></select></label><div id="task" class="math"></div><button id="new">Ny oppgave</button><button class="big" id="makeOrigin">Gjør meg til origo</button></section></main>
<div id="axis" hidden><div id="line"></div><div id="label"></div><div id="message" hidden></div><div id="axisTask"></div><button id="pause">Ta pause</button></div><div id="origin" hidden><button id="back">Meny</button><div><small>ORIGO · gruppeleder</small><div id="originTask" class="math"></div><button id="test">TEST</button><div id="result" class="math" aria-live="polite"></div><button id="next" hidden>Neste oppgave</button></div></div>
<script>
const $=id=>document.getElementById(id),prefix='matlab-build-v1-',members=new Map(),orientation=()=>matchMedia('(orientation: portrait)').matches?'y':'x';let peer,conn,room,paused=false,number=0,serial=0,task=null,busy=false,first=null,phase='',wake,timeout;
$('lobbyPicture').append($('illustration').querySelector('svg').cloneNode(true));
function show(id){for(const k of ['home','lobby','axis','origin'])$(k).hidden=k!==id;keepAwake()}
async function keepAwake(){try{if(!wake||wake.released)wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){keepAwake();if(conn)drawAxis()}});
function status(s){$('status').textContent=s}function send(c,d){if(c.open)c.send(d)}function broadcast(d){for(const m of members.values())send(m.c,d)}
function live(){return [...members.values()].filter(m=>m.c.open&&Date.now()-m.time<8000)}
function counts(){let a=live().filter(m=>!m.paused);return {x:a.filter(m=>m.axis==='x').length,y:a.filter(m=>m.axis==='y').length,n:live().length}}
function refresh(){let n=counts().n;$('count').textContent=n+' aksetelefoner tilkoblet';$('makeOrigin').disabled=!task||n<2;if(!task&&n>=2&&!busy)generate()}
function frac(y,x){return '<span class="frac"><span>'+y+'</span><span>'+x+'</span></span>'}
function gcd(a,b){return b?gcd(b,a%b):a}
function taskHTML(){if(!task)return 'Venter på minst to aksetelefoner';let {x,y,l}=task;return l===1?'Bygg Δy = '+y+' og Δx = '+x:'Bygg a = '+(l===3?(y/x).toLocaleString('nb-NO'):frac(y,x))+(l===4?'<br><small>Med færrest mulig telefoner</small>':l===5?'<br><small>Vis to ulike figurer med samme stigningstall</small>':'')}
function publish(){ $('task').innerHTML=taskHTML();$('originTask').innerHTML=taskHTML();broadcast({type:'task',html:taskHTML()});refresh()}
function generate(){let n=counts().n;if(n<2){task=null;$('task').textContent=taskHTML();refresh();return}let l=Number($('level').value),options=[];for(let x=1;x<n;x++)for(let y=1;x+y<=n;y++){if(l===3&&Math.abs(y/x*100-Math.round(y/x*100))>1e-8)continue;if(l>=4&&gcd(x,y)!==1)continue;if(l===5&&2*(x+y)>n)continue;options.push({x,y,l})}if(!options.length){l=2;options=[{x:1,y:1,l}];$('level').value='2'}task=options[Math.floor(Math.random()*options.length)];first=null;$('result').textContent='';$('next').hidden=true;publish()}
function makePeer(id){const options={debug:1,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]}};return id?new Peer(id,options):new Peer(options)}
function fail(e){clearTimeout(timeout);status('Tilkoblingsfeil: '+(e.type||e.message||'ukjent')+'. Last siden på nytt eller prøv samme Wi-Fi.');if(!$('axis').hidden){$('message').hidden=false;$('message').textContent='Tilkoblingsfeil – last siden på nytt'}}
$('create').onclick=()=>{if(peer)return;status('Oppretter gruppe …');room=Array.from(crypto.getRandomValues(new Uint8Array(6)),v=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[v%32]).join('');try{peer=makePeer(prefix+room)}catch(e){fail(e);return}peer.on('error',fail);peer.on('open',()=>{show('lobby');$('roomLabel').textContent='Gruppekode: '+room;let url=new URL(location.href);url.search='';url.searchParams.set('room',room);$('invite').href=url.href;try{new QRCode($('qr'),{text:url.href,width:160,height:160})}catch(e){}refresh()});peer.on('connection',c=>{c.on('open',()=>{let m={c,number:++serial,time:Date.now(),axis:'',paused:true};members.set(c.peer,m);send(c,{type:'welcome',number:m.number,html:taskHTML()});refresh()});c.on('data',d=>{let m=members.get(c.peer);if(!m||d.type!=='state')return;m.axis=d.axis==='x'?'x':'y';m.paused=!!d.paused;m.time=Date.now();refresh()});c.on('close',()=>{members.delete(c.peer);refresh()})})}
function state(){if(conn?.open)send(conn,{type:'state',axis:orientation(),paused})}
function drawAxis(){let a=orientation();$('axis').className=(a==='x'?'x ':'')+(paused?'off':phase);$('label').textContent='Mobil '+number+' · '+(paused?'Pause':a==='x'?'Δx = 1':'Δy = 1');$('pause').textContent=paused?'Bli med igjen':'Ta pause';state()}
$('join').onclick=()=>{if(peer)return;room=$('code').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(room)){status('Skriv inn seks tegn fra gruppekoden.');return}status('Kobler til …');try{peer=makePeer()}catch(e){fail(e);return}peer.on('error',fail);timeout=setTimeout(()=>{if(!conn?.open)fail({message:'Tidsavbrudd'})},25000);peer.on('open',()=>{status('Signalserver klar – kobler til gruppen …');conn=peer.connect(prefix+room,{reliable:true,serialization:'json'});conn.on('open',()=>{clearTimeout(timeout);show('axis');drawAxis()});conn.on('data',d=>{if(d.type==='welcome'){number=d.number;$('axisTask').innerHTML=d.html;drawAxis()}if(d.type==='task'){$('axisTask').innerHTML=d.html;phase='';$('message').hidden=true;drawAxis()}if(d.type==='phase'){phase=d.phase==='y'||d.phase==='x'?(orientation()===d.phase?'lit':''):d.phase;$('message').hidden=paused||!d.message;$('message').textContent=d.message||'';drawAxis()}});conn.on('close',()=>{show('home');status('Gruppen ble frakoblet. Last siden på nytt.')});conn.on('error',fail)})}
$('pause').onclick=()=>{paused=!paused;drawAxis()};addEventListener('resize',()=>{if(conn)drawAxis()});setInterval(()=>{if(conn)state();if(peer&&room&&!conn&&!$('lobby').hidden)refresh()},1000);
$('level').onchange=generate;$('new').onclick=generate;$('makeOrigin').onclick=()=>{if(task)show('origin')};$('back').onclick=()=>{if(!busy)show('lobby')};$('next').onclick=generate;
const wait=ms=>new Promise(r=>setTimeout(r,ms));$('test').onclick=async()=>{if(busy||!task)return;busy=true;$('test').disabled=true;$('next').hidden=true;let {x,y}=counts(),t=task,ok=x>0&&y*t.x===x*t.y;if(t.l===1||t.l===4)ok=ok&&x===t.x&&y===t.y;let partial=false;if(t.l===5&&ok){if(!first){first={x,y};partial=true}else ok=x!==first.x||y!==first.y} $('result').textContent='Δy = '+y;broadcast({type:'phase',phase:'y',message:''});await wait(500);$('result').textContent='Δx = '+x;broadcast({type:'phase',phase:'x',message:''});await wait(500);$('result').innerHTML='a = '+frac('Δy','Δx')+' = '+frac(y,x)+(x===0?' (ikke definert)':'');await wait(700);let msg=partial?'Riktig! Bygg en annen figur.':ok?'RIKTIG!':'Prøv igjen!';$('result').innerHTML+='<br>'+msg;broadcast({type:'phase',phase:ok?'win':'fail',message:msg});await wait(1400);broadcast({type:'phase',phase:'',message:''});$('next').hidden=!ok||partial;$('test').disabled=false;busy=false};
let q=new URLSearchParams(location.search).get('room');if(q){$('code').value=q;status('Trykk Bli med i gruppe.')}
</script></html>
